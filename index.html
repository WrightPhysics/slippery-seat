<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slippery Seat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: the road (canvas) fills the left; a narrow control rail sits on the right and stacks below on small screens. */
:root{
  --bg:#f3f5fa;
  --panel:#ffffff;
  --floor:#fbfcfe;
  --ink:#141a2b;
  --muted:#5b6478;
  --line:#d3d9e6;
  --accent:#1e44b4;      /* worksheet blue */
  --accent-ink:#ffffff;
  --vel:#0a7d55;         /* velocity: green */
  --net:#e8740c;         /* force on Rex (the net sideways force): orange */
  --car:#aab4c6;         /* car body: neutral slate, kept away from the vector colors */
  --car-edge:#6b7690;
  --glass:#dfe8f5;
  --seat:#7d879c;
  --off:#8a93a6;
  --font: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1220; --panel:#171c2e; --floor:#121728; --ink:#eef1f8; --muted:#9aa4bb;
    --line:#2c3450; --accent:#7f9cff; --accent-ink:#0b1020; --vel:#3fd6a0; --net:#ffa040;
    --car:#3a4462; --car-edge:#7c87a6; --glass:#26304a; --seat:#56607c; --off:#5d6680;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1220; --panel:#171c2e; --floor:#121728; --ink:#eef1f8; --muted:#9aa4bb;
  --line:#2c3450; --accent:#7f9cff; --accent-ink:#0b1020; --vel:#3fd6a0; --net:#ffa040;
  --car:#3a4462; --car-edge:#7c87a6; --glass:#26304a; --seat:#56607c; --off:#5d6680;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.35}
.app{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;padding:16px;height:100%;max-width:1400px;margin:0 auto}
.stage{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0}
.head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-size:1.35rem;margin:0;text-wrap:balance}
.caption{color:var(--muted);font-size:1.05rem}
.floorwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--floor);border:1px solid var(--line);border-radius:10px;overflow:hidden}
canvas{display:block;max-width:100%;max-height:100%}
.rail{display:flex;flex-direction:column;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto}
.rail>*{flex-shrink:0}
.group{display:flex;flex-direction:column;gap:8px}
.label{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;font:inherit;font-weight:700;padding:10px 12px;border-radius:8px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;min-width:80px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--vel);outline-offset:2px}
/* seat belt switch */
.gsw{display:flex;align-items:center;gap:12px;width:100%;font:inherit;font-weight:700;color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left}
.gsw .track{flex:none;position:relative;width:52px;height:30px;border-radius:15px;background:var(--off);transition:background .15s}
.gsw .knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.gsw[aria-checked="true"] .track{background:var(--accent)}
.gsw[aria-checked="true"] .knob{left:25px}
.gsw .state{margin-left:auto;font-size:.9rem;color:var(--muted)}
label.chk{display:flex;align-items:center;gap:8px;cursor:pointer}
label.chk input{width:18px;height:18px;accent-color:var(--accent)}
.sw{display:inline-block;width:22px;height:4px;border-radius:2px;margin-left:auto}
.sw.v{background:var(--vel)} .sw.n{background:var(--net)} .sw.p{background:var(--ink)}
.mk{margin-left:auto;font-size:1.05rem;line-height:1}
input[type=range]{width:100%;accent-color:var(--accent)}
.ends{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-top:-4px}
.hint{font-size:.8rem;color:var(--muted)}
@media (max-width:820px){
  html,body{height:auto}
  .app{grid-template-columns:1fr;height:auto}
  .floorwrap{flex:none}
}
</style>
</head>
<body>
<div class="app">
  <section class="stage">
    <div class="head">
      <h1>Slippery Seat</h1>
      <div class="caption" id="caption"></div>
    </div>
    <div class="floorwrap" id="wrap"><canvas id="cv" aria-label="Top view of Doris's car making a right turn; Rex slides across the slick seat until he hits Doris at point B"></canvas></div>
  </section>

  <aside class="rail">
    <div class="group">
      <div class="row">
        <button class="btn" id="play">Play</button>
        <button class="btn ghost" id="step">Step</button>
        <button class="btn ghost" id="reset">Reset</button>
      </div>
    </div>

    <button class="gsw" id="belt" role="switch" aria-checked="false">
      <span class="track"><span class="knob"></span></span>Rex's seat belt<span class="state" id="beltState">OFF</span>
    </button>

    <div class="group">
      <div class="label">Positions</div>
      <label class="chk"><input type="checkbox" id="cDoris" checked>Doris (driver, belted)<span class="mk">⊗</span></label>
      <label class="chk"><input type="checkbox" id="cRex" checked>Rex (passenger)<span class="mk">●</span></label>
      <label class="chk"><input type="checkbox" id="cPath" checked>Doris's path<span class="sw p"></span></label>
      <label class="chk"><input type="checkbox" id="cCar" checked>Car</label>
    </div>

    <div class="group">
      <div class="label">Vectors</div>
      <label class="chk"><input type="checkbox" id="cF"><span id="fLab">Force on Rex by Doris</span><span class="sw n"></span></label>
      <label class="chk"><input type="checkbox" id="cV">Rex's velocity <i>v</i><span class="sw v"></span></label>
    </div>

    <div class="group">
      <div class="label">Show</div>
      <label class="chk"><input type="checkbox" id="cIn" checked>Inside the car (close-up)</label>
      <label class="chk"><input type="checkbox" id="cCen">Center of the turn</label>
      <label class="chk"><input type="checkbox" id="cSlow">Slow motion</label>
    </div>

    <div class="group">
      <label for="rad" class="label">Turn</label>
      <input type="range" id="rad" min="200" max="460" step="20" value="380">
      <div class="ends"><span>sharper</span><span>wider</span></div>
      <div class="hint">The seats are waxed vinyl, so the seat can't push Rex sideways. A sharper turn brings Doris to him sooner.</div>
      <div class="hint">Keys: Space play/pause, S step, R reset, B seat belt, F force arrows.</div>
    </div>
  </aside>
</div>

<script>
(function(){
  "use strict";
  /* ---------- model (screen pixels, y down) ----------
     The car's center drives straight up, turns right on a circle of radius Rc (center C), then drives straight right.
     Car frame: u = to the car's right, w = forward. Doris sits at u = -H (outside of the turn), Rex at u = +H.
     Rex (no belt) keeps his velocity on the frictionless seat: a straight line, until he is 2·RB from Doris (point B).
     After B he moves with the car (held by Doris), so he goes around the circle, pushed toward C by Doris. */
  var W=760,H=760,V=150,DS=45,T=DS/V,HS=20,RB=10,PRE=3;
  var XA=110,YA=565;        // car center where the turn starts; A is Doris's spot there
  var sA=PRE*DS;            // distance the car travels before A
  var Rc=380,belt=false,t=0,running=false,last=0,tc=null,L=null,B=null;
  var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),wrap=document.getElementById('wrap');
  var $=function(id){return document.getElementById(id)};
  var col={};

  function sTurn(){return Rc*Math.PI/2;}
  function tEnd(){return (sA+sTurn()+2.5*DS)/V;}
  function C(){return {x:XA+Rc,y:YA};}
  function car(s){
    if(s<sA) return {x:XA,y:YA+(sA-s),th:0,turning:false};
    var d=s-sA,c=C();
    if(d<=sTurn()){var th=d/Rc;return {x:c.x-Rc*Math.cos(th),y:c.y-Rc*Math.sin(th),th:th,turning:true};}
    return {x:c.x+(d-sTurn()),y:c.y-Rc,th:Math.PI/2,turning:false};
  }
  function axes(c){var f={x:Math.sin(c.th),y:-Math.cos(c.th)};return {f:f,r:{x:-f.y,y:f.x}};}
  function toWorld(c,u,w){var a=axes(c);return {x:c.x+u*a.r.x+w*a.f.x,y:c.y+u*a.r.y+w*a.f.y};}
  function toCar(c,p){var a=axes(c),dx=p.x-c.x,dy=p.y-c.y;return {u:dx*a.r.x+dy*a.r.y,w:dx*a.f.x+dy*a.f.y};}
  function doris(t){return toWorld(car(V*t),-HS,0);}
  function rexFree(t){return {x:XA+HS,y:YA+sA-V*t};}
  function held(t){return belt||(tc!==null&&t>=tc);}
  function rexCar(t){if(belt) return {u:HS,w:0}; if(held(t)) return L; return toCar(car(V*t),rexFree(t));}
  function rex(t){return held(t)?toWorld(car(V*t),rexCar(t).u,rexCar(t).w):rexFree(t);}
  function pushing(t){return held(t)&&car(V*t).turning;}
  function rexVel(t){var e=1e-3,a=rex(t),b=rex(t+e);return {x:(b.x-a.x)/e,y:(b.y-a.y)/e};}

  // Find the moment Rex reaches Doris (point B) once, by stepping finely through the turn.
  function setup(){
    tc=null;L=null;B=null;
    if(belt) return;
    for(var tt=sA/V,te=tEnd();tt<te;tt+=0.001){
      var d=doris(tt),r=rexFree(tt);
      if(Math.hypot(d.x-r.x,d.y-r.y)<=2*RB){tc=tt;L=toCar(car(V*tt),r);B=r;return;}
    }
  }
  function reset(){running=false;t=0;setup();sync();draw();}

  /* ---------- drawing ---------- */
  function readColors(){
    var cs=getComputedStyle(document.documentElement);
    ['floor','ink','muted','line','accent','vel','net','car','car-edge','glass','seat'].forEach(function(k){col[k]=cs.getPropertyValue('--'+k).trim();});
  }
  function arrow(x1,y1,x2,y2,c,w){
    var a=Math.atan2(y2-y1,x2-x1),h=5+w*2.2;
    ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineWidth=w;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2-Math.cos(a)*h*0.8,y2-Math.sin(a)*h*0.8);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x2,y2);
    ctx.lineTo(x2-h*Math.cos(a-0.45),y2-h*Math.sin(a-0.45));
    ctx.lineTo(x2-h*Math.cos(a+0.45),y2-h*Math.sin(a+0.45));ctx.closePath();ctx.fill();
  }
  function otimes(x,y,r){   // Doris: circled X
    ctx.fillStyle=col.floor;ctx.strokeStyle=col.ink;ctx.lineWidth=1.8;
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.stroke();
    var k=r*0.7;ctx.beginPath();ctx.moveTo(x-k,y-k);ctx.lineTo(x+k,y+k);ctx.moveTo(x+k,y-k);ctx.lineTo(x-k,y+k);ctx.stroke();
  }
  function dot(x,y,r){      // Rex: solid circle
    ctx.fillStyle=col.ink;ctx.strokeStyle=col.floor;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.stroke();
  }
  function text(s,x,y,size,c,align,bold){
    ctx.font=(bold?'700 ':'')+size+'px '+getComputedStyle(document.body).fontFamily;
    ctx.fillStyle=c;ctx.textAlign=align||'left';ctx.textBaseline='middle';
    ctx.lineWidth=4;ctx.strokeStyle=col.floor;ctx.lineJoin='round';ctx.strokeText(s,x,y);ctx.fillText(s,x,y);
  }
  // The car, drawn in car-local coordinates (forward = -y), scale k.
  function carBody(k,people,rc){
    ctx.save();ctx.scale(k,k);
    ctx.globalAlpha=0.92;
    ctx.fillStyle=col.car;ctx.strokeStyle=col['car-edge'];ctx.lineWidth=2/k*1.2;
    rrect(-38,-62,76,118,16);ctx.fill();ctx.stroke();
    ctx.fillStyle=col.glass;
    ctx.beginPath();ctx.moveTo(-30,-30);ctx.lineTo(30,-30);ctx.lineTo(26,-42);ctx.lineTo(-26,-42);ctx.closePath();ctx.fill();   // windshield
    rrect(-28,38,56,8,3);ctx.fill();                                                                                            // rear window
    ctx.fillStyle=col.seat;
    // one bench seat across the front, so Rex can slide straight over to Doris
    rrect(-HS-14,-14,2*HS+28,26,6);ctx.fill();                                                                                   // cushion
    rrect(-HS-14,12,2*HS+28,7,3);ctx.fill();                                                                                     // bench back
    ctx.strokeStyle=col.car;ctx.lineWidth=1;ctx.globalAlpha=0.5;                                                                 // vinyl seams
    ctx.beginPath();for(var i=-2;i<=2;i++){ctx.moveTo(i*HS*0.6,-11);ctx.lineTo(i*HS*0.6,9);}ctx.stroke();
    ctx.globalAlpha=0.92;
    ctx.globalAlpha=1;
    if(people){
      // seat-belt straps (drawn first so they peek out behind the person)
      ctx.strokeStyle=col.ink;ctx.lineWidth=2.4;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(-HS+13,-13);ctx.lineTo(-HS-13,13);ctx.stroke();
      if(belt){ctx.beginPath();ctx.moveTo(HS-13,-13);ctx.lineTo(HS+13,13);ctx.stroke();}
      otimes(-HS,0,RB);
      dot(rc.u,-rc.w,RB);
    }
    ctx.restore();
  }
  function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

  function draw(){
    readColors();
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle=col.floor;ctx.fillRect(0,0,W,H);
    var c=C(),now=car(V*t);

    // center of the turn
    if($('cCen').checked){
      ctx.save();ctx.strokeStyle=col.muted;ctx.lineWidth=1.5;ctx.setLineDash([5,5]);
      ctx.beginPath();ctx.arc(c.x,c.y,Rc,Math.PI,1.5*Math.PI);ctx.stroke();ctx.setLineDash([]);
      ctx.beginPath();ctx.moveTo(c.x-7,c.y);ctx.lineTo(c.x+7,c.y);ctx.moveTo(c.x,c.y-7);ctx.lineTo(c.x,c.y+7);ctx.stroke();ctx.restore();
      text('center of the turn',c.x+10,c.y+14,13,col.muted);
    }
    // Doris's path (the whole planned path, like the worksheet)
    if($('cPath').checked){
      ctx.strokeStyle=col.ink;ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();
      for(var s=0,se=V*tEnd();s<=se+0.1;s+=4){var p=toWorld(car(Math.min(s,se)),-HS,0);if(s===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);}
      ctx.stroke();
    }
    // positions every T seconds
    var n=Math.floor(t/T+1e-9),showF=$('cF').checked;
    for(var k=0;k<=n;k++){
      var tk=k*T;
      if($('cDoris').checked){var d=doris(tk);otimes(d.x,d.y,8);}
    }
    for(k=0;k<=n;k++){
      tk=k*T;var r=rex(tk);
      if(showF&&pushing(tk)){var u=unit(c.x-r.x,c.y-r.y);arrow(r.x,r.y,r.x+u.x*44,r.y+u.y*44,col.net,3.5);}
      if($('cRex').checked) dot(r.x,r.y,7);
    }
    if(B&&t>=tc&&$('cRex').checked) dot(B.x,B.y,7);
    // labels A and B
    var a=doris(sA/V);
    text('A',a.x-16,a.y,17,col.ink,'right',true);
    if(B&&t>=tc) text('B',B.x+11,B.y+14,17,col.ink,'left',true);

    // the car and the two people now
    if($('cCar').checked){
      ctx.save();ctx.translate(now.x,now.y);ctx.rotate(now.th);carBody(1,false);ctx.restore();
    }
    var dn=doris(t),rn=rex(t);
    otimes(dn.x,dn.y,RB);dot(rn.x,rn.y,RB);
    if($('cV').checked){var v=rexVel(t),kv=56/V;arrow(rn.x,rn.y,rn.x+v.x*kv,rn.y+v.y*kv,col.vel,3.5);}
    if(showF){
      if(pushing(t)){var uf=unit(c.x-rn.x,c.y-rn.y);arrow(rn.x,rn.y,rn.x+uf.x*44,rn.y+uf.y*44,col.net,4);text('F',rn.x+uf.x*44+8,rn.y+uf.y*44-12,15,col.net,'left',true);}
      else text(belt?'F by belt = 0':'F by Doris = 0',rn.x,rn.y-34,13,col.net,'center',true);   // above Rex, so it stays on the canvas at the end
    }
    if($('cIn').checked) inset(now);
  }
  function unit(x,y){var l=Math.hypot(x,y)||1;return {x:x/l,y:y/l};}

  // Close-up of the front seat, seen from inside the car (the car stays pointing up).
  function inset(now){
    var x0=470,y0=598,w=274,h=148,k=2.1,cx=x0+w/2,cy=y0+h/2+14;   // below the turn's center (y = 565) so its marker stays visible
    ctx.save();
    ctx.fillStyle=col.floor;ctx.strokeStyle=col.line;ctx.lineWidth=1.5;rrect(x0,y0,w,h,10);ctx.fill();ctx.stroke();
    rrect(x0,y0,w,h,10);ctx.clip();
    ctx.translate(cx,cy);
    var rc=rexCar(t);
    carBody(k,true,rc);
    // Rex's earlier spots in the car, so his slide shows
    if(!belt){
      ctx.save();ctx.scale(k,k);ctx.globalAlpha=0.45;
      for(var j=PRE;j*T<=t;j++){var q=rexCar(j*T);ctx.fillStyle=col.ink;ctx.beginPath();ctx.arc(q.u,-q.w,2.6,0,Math.PI*2);ctx.fill();}
      ctx.restore();
    }
    if($('cF').checked){
      var px=rc.u*k,py=-rc.w*k;
      if(pushing(t)){var cc=toCar(now,C()),u=unit(cc.u-rc.u,-(cc.w-rc.w));arrow(px,py,px+u.x*48,py+u.y*48,col.net,4);}
    }
    ctx.restore();
    text('Inside the car',x0+12,y0+16,14,col.ink,'left',true);
    text(t>=tc&&!belt?'Rex is against Doris':belt?'Rex is buckled in':'Rex on the slick seat',x0+w-12,y0+16,13,col.muted,'right');
  }

  /* ---------- loop & UI ---------- */
  function frame(ts){
    if(!running) return;
    var dt=Math.min(0.05,(ts-last)/1000);last=ts;
    t+=dt*($('cSlow').checked?0.3:1);
    if(t>=tEnd()){t=tEnd();running=false;}
    draw();sync();
    if(running) requestAnimationFrame(frame);
  }
  function play(){
    if(t>=tEnd()) {t=0;}
    running=!running;
    if(running){last=performance.now();requestAnimationFrame(frame);}
    sync();
  }
  function stepOnce(){
    running=false;
    if(t>=tEnd()) return;
    t=Math.min(tEnd(),(Math.floor(t/T+1e-9)+1)*T);
    draw();sync();
  }
  function setBelt(on){
    belt=on;$('belt').setAttribute('aria-checked',String(on));$('beltState').textContent=on?'ON':'OFF';
    $('fLab').textContent=on?'Force on Rex by the seat belt':'Force on Rex by Doris';
    reset();
  }
  function caption(){
    var c=car(V*t),s;
    if(V*t<sA) s='Driving straight. Doris and Rex move together.';
    else if(belt) s=c.turning?'The seat belt pulls Rex around the turn with the car.':'The turn is over. Nothing has to push sideways to go straight.';
    else if(t<tc) s='The car turns right. Nothing pushes Rex sideways, so he keeps going straight.';
    else if(c.turning) s='Doris pushes Rex toward the center of the turn, so he turns with the car.';
    else s='The turn is over. Nothing has to push sideways to go straight.';
    $('caption').textContent=s;
  }
  function sync(){
    $('play').textContent=running?'Pause':(t>=tEnd()?'Play again':(t>0?'Resume':'Play'));
    $('step').disabled=t>=tEnd();
    caption();
  }
  function fit(){
    var r=wrap.getBoundingClientRect();
    var availW=r.width,availH=window.innerWidth<=820?Infinity:r.height;
    var s=Math.min(availW/W,availH/H);
    if(!isFinite(s)||s<=0) s=1;
    var dpr=window.devicePixelRatio||1;
    cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';
    cv.width=Math.round(W*s*dpr);cv.height=Math.round(H*s*dpr);
    ctx.setTransform(s*dpr,0,0,s*dpr,0,0);
    draw();
  }

  $('play').addEventListener('click',play);
  $('step').addEventListener('click',stepOnce);
  $('reset').addEventListener('click',reset);
  $('belt').addEventListener('click',function(){setBelt(!belt);});
  ['cDoris','cRex','cPath','cCar','cF','cV','cIn','cCen'].forEach(function(id){$(id).addEventListener('change',draw);});
  $('rad').addEventListener('input',function(e){Rc=+e.target.value;reset();});
  document.addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    if(e.target.tagName==='INPUT'&&e.target.type==='range') return;
    var k=e.key.toLowerCase();
    if(k===' '){e.preventDefault();if(e.target.blur&&e.target.tagName==='BUTTON')e.target.blur();play();}
    else if(k==='s'){stepOnce();}
    else if(k==='r'){reset();}
    else if(k==='b'){setBelt(!belt);}
    else if(k==='f'){$('cF').checked=!$('cF').checked;draw();}
  });
  window.addEventListener('resize',fit);
  if(window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){draw();});
  new MutationObserver(function(){draw();}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  setup();sync();fit();
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(draw);
})();
</script>
</body>
